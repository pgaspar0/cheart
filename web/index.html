<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Consegui!</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff4d6d' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Menu de Seleção de Cor -->
    <div id="menu-screen" class="screen">
      <div class="menu-header">
        <h1 class="menu-title">ESCOLHA A COR DO CORAÇÃO</h1>
        <p class="menu-subtitle">Clique numa opção ou pressione a tecla (1 - 6)</p>
      </div>

      <div class="cards-container" id="cards-container">
        <!-- Gerado via JavaScript ou estático -->
      </div>

      <p class="menu-tip">Dica: Use o mouse para clicar ou as teclas 1 a 6</p>
      <div class="discreet-credit">
        <div>Motivação, Célia T.</div>
        <div class="fun-credit">Consegui ahahahahahaha!</div>
      </div>
    </div>

    <!-- Tela do Coração Animado -->
    <div id="heart-screen" class="screen hidden">
      <canvas id="heartCanvas"></canvas>
      <!-- Barra Superior com Botão Voltar e Leitor de Áudio (Cherry) -->
      <div class="top-bar">
        <button id="btn-back" class="btn-back" title="Escolher outra cor">← Trocar Cor</button>
        <div id="cherry-audio-player" class="cherry-audio-player hidden">
          <audio id="spiderman-audio" src="spiderman-sound-effect.mp3" preload="auto"></audio>
          <button id="audio-play-btn" class="audio-btn" title="Reproduzir som">
            <span id="play-icon">▶</span>
          </button>
          <div class="audio-info">
            <div class="audio-title">
              <span class="audio-spider-icon">🕷️</span>
              <span class="audio-label">Spider-Sound</span>
            </div>
            <div class="audio-progress-wrap" id="audio-progress-wrap" title="Avançar / Retroceder">
              <div class="audio-progress-bar" id="audio-progress-bar"></div>
            </div>
          </div>
          <span class="audio-time" id="audio-time">0:00</span>
          <button id="audio-loop-btn" class="audio-btn audio-btn-loop" title="Repetir em loop">
            <span>🔁</span>
          </button>
        </div>
      </div>
      <div class="heart-credit">
        <div>Motivação, Célia T.</div>
        <div class="fun-credit">Consegui ahahahahahaha!</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
